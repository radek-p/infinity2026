- time: 14:05 to 14:50
  title: Fine-Grained Dichotomies for evaluating database queries
  speaker: Nofar Carmeli
  abstract: >-
    Consider the task of evaluating queries over databases. We will start by
    considering a very simple class of queries: join queries, and a simple
    question: when can the query answers be enumerated with ideal time guarantees
    (linear preprocessing and constant delay)? 
    
    As time permits, we will progress
    into more expressive query classes (conjunctive queries and unions of
    conjunctive queries), and into more demanding query-answering tasks, such as
    allowing direct access to query answers (i.e., simulating a sorted array
    containing the answers), every time asking a similar question. 
    
    The answer to
    such a question is always a dichotomy: a condition on the query structure, an
    efficient query evaluation algorithm in case it is satisfied, and a
    conditional lower bound in case it is not.

- time: 14:50 to 15:20
  title: Coffee

- time: 15:20 to 16:05
  title: On The Fine Grained Complexity of Multi-Stack Reachability
  speaker: Michael Wehar
  abstract: >-
    Determining whether there exists a string that is accepted by a given
    pushdown automaton (PDA) is referred to as the non-emptiness problem for
    pushdown automata. This is a classic problem that is complete for polynomial
    time. Attempts to prove an unconditional superlinear time complexity lower
    bound for this problem have been unsuccessful. However, an unconditional time
    complexity lower bound can be proven for the intersection non-emptiness
    problem for one PDA and multiple DFAs. We apply this result to show a lower
    bound for the non-emptiness problem for multi-stack pushdown automata with
    bounded phase switches (i.e. multi-stack PDAs where all stacks can push, but
    only one designated stack can pop per switch). In particular, for \(k\) phase
    switches, we prove a near-tight time complexity lower bound of \(n^{\Theta(2^k)}\)
    where \(n\) is the number of states and \(k\) is the number of phase switches.

- time: 16:05 to 16:15
  title: Mini break (no coffee)

- time: 16:15 to 17:00
  title: On the Fine-Grained Complexity of Concurrency Testing
  speaker: Andreas Pavlogiannis
  abstract: >-
    Concurrency is ubiquitous and comes in various forms, from multi-threading
    inside a CPU to distributed systems, databases, and the internet of things.
    Testing whether a concurrent system adheres to its prescribed behavior is a
    natural algorithmic task, and a de-facto practice among researchers and
    system developers. In this talk, we will overview the algorithmic complexity
    of testing various systems and properties, through the fine-grained lens.
    This is a rich landscape, even more so since concurrent systems exhibit
    natural syntactic parameters, such as the number of communicating processes,
    the number of shared objects, etc. We will also study concurrency testing
    from the perspective of modern weak memory, whereby a concurrent system is
    allowed to exhibit complex and often counter-intuitive behaviors that escape
    the standard interleaving view. The plethora of weak memory models provides a
    fertile ground for fun and interesting fine-grained complexity questions of
    practical relevance, some of which we will tackle in this talk.

- time: 17:00 to 17:10
  title: Mini break (no coffee)

- time: 17:10 to 17:55
  title: Online Orthogonal Vectors Revisited
  speaker: Alexander Golovnev
  abstract: >-
    We prove new upper and lower bounds for the Online Orthogonal Vectors
    Problem (OnlineOV). In this problem, a preprocessing algorithm receives \(n\)
    vectors and constructs a data structure of size \(S\). Subsequently, a query
    algorithm receives a vector \(q\) and, in time \(T\), determines whether \(q\) is
    orthogonal to any of the input vectors. 
    
    Using a novel
    structure-versus-randomness decomposition, we design data structures that
    outperform all known constructions and refute a conjecture regarding the
    hardness of OnlineOV. On the lower-bound side, assuming the Non-uniform
    Strong Exponential Time Hypothesis, we prove arbitrarily large polynomial
    lower bounds on the space \(S\) required by any OnlineOV data structure with
    computationally unbounded preprocessing and sublinear query time.

